{{ define "main" }}
    <article class="post">
        <header>
            <h1>{{ .Title }}</h1>
            <small>
                <time datetime="{{ .Date.Format "2006-01-02" }}">
                    {{ .Date.Format "2006-01-02" }}
                </time>
                / {{ .ReadingTime }} min read
            </small>
        </header>

        <div class="content">
            {{ .Content }}
        </div>
    </article>
{{ end }}
