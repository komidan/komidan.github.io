<ul>
    {{ range sort .pages "Title" }}
        {{ if or (not $.activeOnly) (eq .Params.status "active") }}
            <li>
                <a href="{{ .RelPermalink }}">{{ .Title }}</a>
                <small>
                    <time datetime="{{ .Date.Format "2006-01-02" }}">
                        {{ .Date.Format "2006-01-02" }}
                    </time>
                    /
                    <span class="status status-{{ .Params.status}}">
                        [{{ .Params.status }}]
                    </span>
                    /
                    <a class="source-link" href="{{ .Params.repo }}">source</a>
                </small>
                <div>{{ .Description }}</div>
            </li>
        {{ end }}
    {{ end }}
</ul>
